    // ==========================================
    // NORMALIZAÇÃO E UTILITÁRIOS DE DADOS
    // ==========================================
    function formatNow() {
      const now = new Date();
      const d = now.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const t = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      return `${d}, ${t}`;
    }

    function normalizeDateToISO(val) {
      if (!val) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
      const m = String(val).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) return `${m[3]}-${m[2]}-${m[1]}`;
      return "";
    }

    function formatISOToBR(iso) {
      if (!iso) return "";
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) return `${m[3]}/${m[2]}/${m[1]}`;
      return iso;
    }

    function normalizePI(val, fallbackCycle) {
      if (val === "Backlog") return "Backlog";
      if (PI_OPTIONS.includes(val)) return val;
      const s = String(val || fallbackCycle || "").toUpperCase();
      if (s.includes("1")) return "PI1";
      if (s.includes("2")) return "PI2";
      if (s.includes("3")) return "PI3";
      if (s.includes("4")) return "PI4";
      return "PI3";
    }

    function normalizeStream(stream) {
      if (stream === "DW" || stream === "DOWN") return "DOWN";
      if (stream === "UP/DW" || stream === "UP e DOWN") return "UP e DOWN";
      if (stream === "UP") return "UP";
      return "UP e DOWN";
    }

    function normalizeBrand(brand) {
      if (!brand) return "Todas";
      const b = String(brand).toLowerCase();
      if (b.includes("todas")) return "Todas";
      if (b.includes("fleury")) return "Fleury";
      if (b.includes("labs")) return "Labs";
      if (b.includes("a+") || b.includes("amais")) return "Amais";
      return BRAND_OPTIONS.includes(brand) ? brand : "Todas";
    }

    const JOURNEY_MAP_NORMALIZE = {
      "login/cadastro": "Login/Cadastro",
      "dia e hora": "Dia e Hora",
      "tipo de atendimento": "Tipo de Atendimento",
      "área logada": "Área Logada",
      "area logada": "Área Logada"
    };

    function normalizeJourneys(list) {
      if (!Array.isArray(list)) return [];
      const mapped = list.map(j => {
        const lower = String(j).trim().toLowerCase();
        if (JOURNEY_MAP_NORMALIZE[lower]) return JOURNEY_MAP_NORMALIZE[lower];
        const found = JOURNEY_OPTIONS.find(o => o.toLowerCase() === lower);
        return found || j;
      }).filter(j => JOURNEY_OPTIONS.includes(j));
      return Array.from(new Set(mapped));
    }

    const METRIC_MAP_NORMALIZE = {
      "autoserviço": "Autosserviço",
      "autosserviço": "Autosserviço",
      "redução cac": "Redução de CAC",
      "redução de cac": "Redução de CAC"
    };

    function normalizeMetrics(list) {
      if (!Array.isArray(list)) return [];
      const mapped = list.map(m => {
        const lower = String(m).trim().toLowerCase();
        if (METRIC_MAP_NORMALIZE[lower]) return METRIC_MAP_NORMALIZE[lower];
        const found = METRIC_OPTIONS.find(o => o.toLowerCase() === lower);
        return found || null;
      }).filter(Boolean);
      return Array.from(new Set(mapped));
    }

    function normalizeComments(comments, itemId) {
      if (!Array.isArray(comments)) return [];
      return comments.map((c, idx) => {
        if (typeof c === "string") {
          return {
            id: `legacy-${itemId}-${idx}`,
            text: c,
            createdAt: "Histórico anterior",
            updatedAt: null,
            isSystem: false
          };
        }
        return {
          id: c.id || `c-${itemId}-${idx}-${Date.now()}`,
          text: c.text || "",
          createdAt: c.createdAt || formatNow(),
          updatedAt: c.updatedAt || null,
          isSystem: Boolean(c.isSystem)
        };
      });
    }

    const LEGACY_STATUS_MAP = {
      "UX pausado": "UX atuando",
      "PO refinamento": "Refinamento PO/TL",
      "VWO - configurando": "VWO config",
      "VWO - teste no ar": "VWO teste",
      "Pronto pra DEV": "Pronto pra dev"
    };

    function normalizeStatus(rawStatus) {
      if (!rawStatus) return "Backlog";
      const mapped = LEGACY_STATUS_MAP[rawStatus] || rawStatus;
      return STATUS_LIST.includes(mapped) ? mapped : "Backlog";
    }

    function normalizeItem(raw, idx = 0) {
      const status = normalizeStatus(raw.status);
      const parsedPi = normalizePI(raw.pi, raw.cycle);
      const previousPi = PI_CYCLE_OPTIONS.includes(raw.previousPi)
        ? raw.previousPi
        : (PI_CYCLE_OPTIONS.includes(parsedPi) ? parsedPi : "PI3");
      const pi = PI_OPTIONS.includes(parsedPi)
        ? parsedPi
        : (status === "Backlog" ? "Backlog" : previousPi);
      const piUp = raw.piUp ? normalizePI(raw.piUp) : "";
      const piDown = raw.piDown ? normalizePI(raw.piDown) : "";
      return {
        ...raw,
        id: String(raw.id || Date.now() + idx),
        jira: raw.jira || "AGDE-",
        jiraUrl: raw.jiraUrl || "",
        pi,
        previousPi,
        status,
        stream: normalizeStream(raw.stream),
        type: TYPE_OPTIONS.includes(raw.type) ? raw.type : "História",
        brand: normalizeBrand(raw.brand),
        owners: Array.isArray(raw.owners) ? raw.owners : ["FG"],
        journeys: normalizeJourneys(raw.journeys),
        metrics: normalizeMetrics(raw.metrics),
        comments: normalizeComments(raw.comments, raw.id || idx),
        piUp: PI_OPTIONS.includes(piUp) ? piUp : "",
        piDown: PI_OPTIONS.includes(piDown) ? piDown : "",
        productionDate: normalizeDateToISO(raw.productionDate),
        whatToMeasure: raw.whatToMeasure || "",
        problemSolved: raw.problemSolved || "",
        achievedResult: raw.achievedResult || "",
        deprioritizedReason: raw.deprioritizedReason || "",
        position: typeof raw.position === "number" ? raw.position : idx
      };
    }

    // Extrai o código "AGDE-1234" automaticamente a partir da URL colada
    function parseJiraCode(url) {
      const match = (url || "").match(/AGDE-\d+/i);
      return match ? match[0].toUpperCase() : null;
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map((d, i) => normalizeItem(d, i));
          }
        }
      } catch (e) {
        console.warn("Falha ao ler localStorage:", e);
      }
      const seeded = INITIAL_DATA.map((d, i) => normalizeItem(d, i));
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(seeded));
      } catch (e) {}
      return seeded;
    }

    function MIcon({ name, className = "text-[16px]" }) {
      return <span className={`material-symbols-outlined ${className}`}>{name}</span>;
    }

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
              <div className="bg-white border border-rose-200 rounded-2xl p-6 max-w-lg w-full shadow-lg">
                <div className="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-lg mb-4">
                  <MIcon name="error" className="text-[22px]" />
                </div>
                <h2 className="text-base font-bold text-slate-900 mb-2">Ops! Ocorreu um erro na interface</h2>
                <p className="text-xs text-rose-600 bg-rose-50 p-3 rounded-lg border border-rose-100 font-mono mb-4 break-all">
                  {this.state.error?.toString()}
                </p>
                <button
                  onClick={() => { localStorage.clear(); window.location.reload(); }}
                  className="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2.5 rounded-lg transition"
                >
                  Limpar Cache Local e Recarregar
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

        >

        const readyDev = items.filter(i => i.status === "Pronto pra dev");

        // Por Status
        const byStatus = STATUS_LIST.map(s => {
          const count = items.filter(i => i.status === s).length;
          return { label: s, count, pct: Math.round((count / total) * 100), color: STATUS_BAR_HEX[s] };
        });

        // Por PI (com divisão Concluído vs Em Andamento)
        const byPI = PI_OPTIONS.map(pi => {
          const piItems = items.filter(i => i.pi === pi);
          const done = piItems.filter(i => i.status === "Concluído").length;
          return {
            pi,
            total: piItems.length,
            done,
            open: piItems.length - done,
            pctDone: piItems.length ? Math.round((done / piItems.length) * 100) : 0,
            color: PI_HEX[pi]
          };
        });

        // Por Tipo de Atuação (Stream)
        const byStream = STREAM_OPTIONS.map(st => {
          const count = items.filter(i => i.stream === st.value).length;
          return { label: st.label, count, pct: Math.round((count / total) * 100) };

        return { ...seg, strokeDasharray, strokeDashoffset, color: typeColors[seg.label] || "#64748B" };

    function Board({ onSignOut }) {
      const [items, setItems] = useState(sb ? [] : loadLocal);
      const [syncState, setSyncState] = useState(sb ? "connecting" : "local");
      const [activeTab, setActiveTab] = useState("Todos"); // 'Todos' | 'Dashboard'

      const [dragOverStatus, setDragOverStatus] = useState(null);

      // Estado para Comentários (adicionar / editar / excluir)
      const [newComment, setNewComment] = useState("");
      const [editingCommentId, setEditingCommentId] = useState(null);
      const [editingCommentText, setEditingCommentText] = useState("");

      // Modal de novo card e confirmação de exclusão
      const [isNewModalOpen, setIsNewModalOpen] = useState(false);
      const [itemToDelete, setItemToDelete] = useState(null);

      const timers = useRef({});
      const itemsRef = useRef(items);
      useEffect(() => { itemsRef.current = items; }, [items]);

      const selectedItem = useMemo(
        () => items.find(i => i.id === selectedId) || null,
        [items, selectedId]
      );
      const setSelectedItem = (item) => {
        setSelectedId(item ? item.id : null);
        setEditingCommentId(null);
      };

      // Novo card state
      const [newCard, setNewCard] = useState({
        jira: "AGDE-",
        jiraUrl: "",
        pi: "Backlog",
        title: "",
        stream: "UP e DOWN",
        type: "História",
        status: "Backlog",
        owners: ["FG"],
        brand: "Todas",
        journeys: ["Agendamento"],
        metrics: ["Conversão", "Experiência"],
        description: ""
      });

      // Persistência imediata no localStorage (funciona como cache e modo offline/local)
      useEffect(() => {
        try {
          if (items.length > 0) {
            localStorage.setItem(LOCAL_KEY, JSON.stringify(items));
          }
        } catch (e) {
          console.warn("Erro ao salvar no localStorage:", e);
        }
      }, [items]);

      // Modo online (Supabase): carga inicial, seed automático e Realtime
      useEffect(() => {
        if (!sb) return;
        let channel;
        (async () => {
          const { data, error } = await sb.from("initiatives").select("id,data,position").order("position");
          if (error) {
            console.error(error);
            setSyncState("error");
            setItems(loadLocal());
            return;
          }
          const alreadySeededV4 = localStorage.getItem(SEED_VERSION_KEY) === "1";
          if (data.length === 0 || !alreadySeededV4) {
            const seeded = INITIAL_DATA.map((d, i) => normalizeItem(d, i));
            await sb.from("initiatives").upsert(
              seeded.map(d => ({ id: d.id, data: d, position: d.position })),
              { onConflict: "id" }
            );
            localStorage.setItem(SEED_VERSION_KEY, "1");
            localStorage.setItem(LOCAL_KEY, JSON.stringify(seeded));
            setItems(seeded);
          } else {
            const normalized = data.map((r, idx) => normalizeItem({ ...r.data, id: r.id, position: r.position }, idx));
            setItems(normalized);
          }
          setSyncState("online");

          channel = sb
            .channel("initiatives-rt")
            .on("postgres_changes", { event: "*", schema: "public", table: "initiatives" }, payload => {
              if (payload.eventType === "DELETE") {
                setItems(prev => prev.filter(i => i.id !== payload.old.id));
                return;
              }
              const row = payload.new;
              if (timers.current[row.id]) return;
              const item = normalizeItem({ ...row.data, id: row.id, position: row.position });
              setItems(prev =>
                prev.some(i => i.id === row.id)
                  ? prev.map(i => (i.id === row.id ? item : i))
                  : [item, ...prev]
              );
            })
            .subscribe();
        })();
        return () => { if (channel) sb.removeChannel(channel); };
      }, []);

      // Grava automaticamente no Supabase e no localStorage
      const persist = (id, immediate = false) => {
        try {
          localStorage.setItem(LOCAL_KEY, JSON.stringify(itemsRef.current));
        } catch (e) {}
        if (!sb) return;
        clearTimeout(timers.current[id]);
        const delay = immediate ? 50 : 350;
        timers.current[id] = setTimeout(async () => {
          delete timers.current[id];
          const latest = itemsRef.current.find(i => i.id === id);
          if (!latest) return;
          setSyncState("saving");
          const { error } = await sb.from("initiatives").upsert({
            id: latest.id,
            data: latest,
            position: latest.position ?? 0,
            updated_at: new Date().toISOString()
          });
          if (error) console.error(error);
          setSyncState(error ? "error" : "online");
        }, delay);
      };

      // Exclui permanentemente um item já criado (localStorage + Supabase)
      const confirmDeleteItem = async () => {
        if (!itemToDelete) return;
        const id = itemToDelete.id;
        clearTimeout(timers.current[id]);
        delete timers.current[id];
        setItems(prev => {
          const next = prev.filter(item => item.id !== id);
          itemsRef.current = next;
          try {
            localStorage.setItem(LOCAL_KEY, JSON.stringify(next));
          } catch (e) {}
          return next;
        });
        if (selectedId === id) {
          setSelectedId(null);
        }
        setItemToDelete(null);
        if (sb) {
          setSyncState("saving");
          const { error } = await sb.from("initiatives").delete().eq("id", id);
          if (error) console.error(error);
          setSyncState(error ? "error" : "online");
        }
      };

      // Atualiza múltiplos campos de um card e salva automaticamente
      const updateItemFields = (id, patch, immediate = false) => {
        setItems(prev => {
          const next = prev.map(item => (item.id === id ? { ...item, ...patch } : item));
          itemsRef.current = next;
          return next;
        });
        persist(id, immediate);
      };

      const updateItemField = (id, field, value, immediate = false) => {
        if (field === "pi") {
          if (PI_CYCLE_OPTIONS.includes(value)) {
            updateItemFields(id, { pi: value, previousPi: value }, immediate);
            return;
          }
          if (value === "Backlog") {
            updateItemFields(id, { pi: "Backlog" }, immediate);
            return;
          }
        }
        updateItemFields(id, { [field]: value }, immediate);
      };

      // Movimentação de Status (via Drag & Drop ou Seletor) com registro automático no histórico e regra de PI = Backlog ao entrar na coluna Backlog
      const moveCardStatus = (id, targetStatus) => {
        const current = itemsRef.current.find(i => i.id === id);
        if (!current || current.status === targetStatus) return;
        const originStatus = current.status;
        const timestamp = formatNow();
        const autoLog = {
          id: `mov-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: `Card movimentado de "${originStatus}" para "${targetStatus}"`,
          createdAt: timestamp,
          updatedAt: null,
          isSystem: true
        };
        const updatedComments = [autoLog, ...(current.comments || [])];
        const savedPrevPi = PI_CYCLE_OPTIONS.includes(current.pi)
          ? current.pi
          : (PI_CYCLE_OPTIONS.includes(current.previousPi) ? current.previousPi : "PI3");
        const nextPi =
          targetStatus === "Backlog"
            ? "Backlog"
            : (current.pi === "Backlog" ? savedPrevPi : current.pi);

        updateItemFields(
          id,
          {
            status: targetStatus,
            pi: nextPi,
            previousPi: savedPrevPi,
            comments: updatedComments
          },
          true
        );
      };

      // Atualiza o link do Jira e extrai automaticamente o código AGDE-XXXX
      const handleJiraUrl = (id, url) => {
        const code = parseJiraCode(url);
        updateItemFields(id, code ? { jiraUrl: url, jira: code } : { jiraUrl: url });
      };

      // Alternar seleção em lista (Jornadas, Métricas, Owners)
      const toggleArrayItem = (id, field, value) => {
        const current = itemsRef.current.find(i => i.id === id);
        if (!current) return;
        const list = Array.isArray(current[field]) ? current[field] : [];
        const exists = list.includes(value);
        const updated = exists ? list.filter(v => v !== value) : [...list, value];
        updateItemField(id, field, updated, true);
      };

      // ==========================================
      // GESTÃO DE COMENTÁRIOS (CRIAR, EDITAR, EXCLUIR)
      // ==========================================
      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newComment.trim() || !selectedItem) return;
        const commentObj = {
          id: `com-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          text: newComment.trim(),
          createdAt: formatNow(),
          updatedAt: null,
          isSystem: false
        };
        const updatedComments = [commentObj, ...(selectedItem.comments || [])];
        updateItemField(selectedItem.id, "comments", updatedComments, true);
        setNewComment("");
      };

      const handleStartEditComment = (comment) => {
        setEditingCommentId(comment.id);
        setEditingCommentText(comment.text);
      };

      const handleSaveEditComment = (commentId) => {
        if (!selectedItem || !editingCommentText.trim()) return;
        const updatedComments = (selectedItem.comments || []).map(c =>
          c.id === commentId
            ? { ...c, text: editingCommentText.trim(), updatedAt: formatNow() }
            : c
        );
        updateItemField(selectedItem.id, "comments", updatedComments, true);
        setEditingCommentId(null);
        setEditingCommentText("");
      };

      const handleDeleteComment = (commentId) => {
        if (!selectedItem) return;
        const updatedComments = (selectedItem.comments || []).filter(c => c.id !== commentId);
        updateItemField(selectedItem.id, "comments", updatedComments, true);
      };

      // ==========================================
      // DRAG AND DROP HANDLERS
      // ==========================================
      const handleDragStart = (e, item) => {
        setDraggedItemId(item.id);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", item.id);
      };

      const handleDragEnd = () => {
        setDraggedItemId(null);
        setDragOverStatus(null);
      };

      const handleDragOverColumn = (e, status) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (dragOverStatus !== status) {
          setDragOverStatus(status);
        }
      };

      const handleDropOnColumn = (e, targetStatus) => {
        e.preventDefault();
        const id = e.dataTransfer.getData("text/plain") || draggedItemId;
        setDraggedItemId(null);
        setDragOverStatus(null);
        if (id) {
          moveCardStatus(id, targetStatus);
        }
      };

      // ==========================================
      // FILTRAGEM DE ITENS E ESTATÍSTICAS RÁPIDAS
      // ==========================================
      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const matchesSearch =
            (item.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
            (item.jira || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
            (item.description || "").toLowerCase().includes(searchQuery.toLowerCase());
          const matchesOwner = selectedOwner === "Todos" || (item.owners || []).includes(selectedOwner);
          const matchesStream = selectedStream === "Todas" || item.stream === selectedStream;
          const matchesPI = selectedPIFilter === "Todos" || item.pi === selectedPIFilter;
          const matchesType = selectedTypeFilter === "Todas" || item.type === selectedTypeFilter;
          return matchesSearch && matchesOwner && matchesStream && matchesPI && matchesType;
        });
      }, [items, searchQuery, selectedOwner, selectedStream, selectedPIFilter, selectedTypeFilter]);

      const stats = useMemo(() => {
        return {
          total: filteredItems.length,
          readyForDev: filteredItems.filter(i => i.status === "Pronto pra dev").length,
          vwoLive: filteredItems.filter(i => (i.status || "").startsWith("VWO")).length,
          blocked: filteredItems.filter(i => i.status === "Impedimento").length,
          completed: filteredItems.filter(i => i.status === "Concluído").length
        };
      }, [filteredItems]);

      // Criar nova iniciativa
      const handleCreateCard = (e) => {
        e.preventDefault();
        if (!newCard.title.trim()) return;
        const extractedCode = parseJiraCode(newCard.jiraUrl);
        const nowStr = formatNow();
        const created = normalizeItem({
          id: String(Date.now()),
          jiraUrl: newCard.jiraUrl.trim(),
          position: -Date.now(),
          jira: extractedCode || newCard.jira || "AGDE-NEW",
          pi: newCard.pi,
          stream: newCard.stream,
          type: newCard.type,
          owners: newCard.owners.length ? newCard.owners : ["FG"],
          status: newCard.status,
          title: newCard.title.trim(),
          description: newCard.description,
          comments: [
            {
              id: `c-init-${Date.now()}`,
              text: `Card criado na coluna "${newCard.status}"`,
              createdAt: nowStr,
              updatedAt: null,
              isSystem: true
            }
          ],
          journeys: newCard.journeys,
          metrics: newCard.metrics,
          brand: newCard.brand
        });
        setItems(prev => {
          const next = [created, ...prev];
          itemsRef.current = next;
          return next;
        });
        persist(created.id, true);
        setIsNewModalOpen(false);
        setNewCard({
          jira: "AGDE-",
          jiraUrl: "",
          pi: "Backlog",
          title: "",
          stream: "UP e DOWN",
          type: "História",
          status: "Backlog",
          owners: ["FG"],
          brand: "Todas",
          journeys: ["Agendamento"],
          metrics: ["Conversão", "Experiência"],
          description: ""
        });
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER PRINCIPAL */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div className="max-w-[1600px] mx-auto px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-indigo-200">
                  AD
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-lg font-bold text-slate-900">UX Ops & Backlog Hub</h1>
                    <span className="text-xs font-medium px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 inline-flex items-center gap-1">
                      <MIcon name={SYNC_ICON[syncState] || "cloud_done"} className="text-[14px]" />
                      <span>{SYNC_LABEL[syncState]}</span>
                    </span>
                  </div>
                  <p className="text-xs text-slate-500">
                    Agendamento Digital • Fleury, Amais e Labs
                  </p>
                </div>
              </div>

              {/* NAVEGAÇÃO PRINCIPAL: APENAS "TODOS" E "DASHBOARD" */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/80">
                <button
                  onClick={() => setActiveTab("Todos")}
                  className={`px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 ${
                    activeTab === "Todos"
                      ? "bg-white text-indigo-600 shadow-sm"
                      : "text-slate-600 hover:text-slate-900"
                  }`}
                >
                  <MIcon name="view_kanban" className="text-[16px]" />
                  <span>Todos</span>
                  <span className={`px-1.5 py-0.5 rounded-full text-[10px] ${
                    activeTab === "Todos" ? "bg-indigo-100 text-indigo-700" : "bg-slate-200 text-slate-600"
                  }`}>
                    {items.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab("Dashboard")}
                  className={`px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 ${
                    activeTab === "Dashboard"
                      ? "bg-white text-indigo-600 shadow-sm"
                      : "text-slate-600 hover:text-slate-900"
                  }`}
                >
                  <MIcon name="analytics" className="text-[16px]" />
                  <span>Dashboard</span>
                </button>
              </div>

              {/* KPIs Rápidos & Botão Nova Iniciativa */}
              <div className="flex items-center gap-3">
                <div className="hidden 2xl:flex items-center gap-4 bg-slate-50 px-3.5 py-1.5 rounded-xl border border-slate-200/80 text-xs">
                  <div>
                    <span className="text-[10px] uppercase text-blue-600 font-bold block">Pronto DEV</span>
                    <span className="font-bold text-slate-800">{stats.readyForDev}</span>
                  </div>
                  <div className="h-5 w-px bg-slate-200"></div>
                  <div>
                    <span className="text-[10px] uppercase text-emerald-600 font-bold block">VWO</span>
                    <span className="font-bold text-slate-800">{stats.vwoLive}</span>
                  </div>
                  <div className="h-5 w-px bg-slate-200"></div>
                  <div>
                    <span className="text-[10px] uppercase text-rose-600 font-bold block">Impedimentos</span>
                    <span className="font-bold text-slate-800">{stats.blocked}</span>
                  </div>
                  <div className="h-5 w-px bg-slate-200"></div>
                  <div>
                    <span className="text-[10px] uppercase text-teal-600 font-bold block">Concluídos</span>
                    <span className="font-bold text-slate-800">{stats.completed}</span>
                  </div>
                </div>

                <button
                  onClick={() => setIsNewModalOpen(true)}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5"
                >
                  <MIcon name="add" className="text-[16px]" />
                  <span>Nova Iniciativa</span>
                </button>
                {onSignOut && (
                  <button
                    onClick={onSignOut}
                    className="text-xs font-semibold text-slate-600 hover:text-slate-900 px-3 py-2.5 rounded-xl border border-slate-200 bg-white flex items-center gap-1"
                  >
                    <MIcon name="logout" className="text-[15px]" />
                    <span>Sair</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* BARRA DE FILTROS (EXIBIDA NA ABA "TODOS") */}
          {activeTab === "Todos" && (
            <section className="bg-white/70 backdrop-blur border-b border-slate-200/80">
              <div className="max-w-[1600px] mx-auto px-6 py-2.5 flex flex-wrap items-center justify-between gap-4">
                {/* Busca */}
                <div className="relative flex-1 min-w-[240px] max-w-md">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 flex items-center pointer-events-none">
                    <MIcon name="search" className="text-[16px]" />
                  </span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Buscar por código Jira (ex: AGDE-4220), título ou descrição..."
                    className="w-full pl-9 pr-8 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery("")}
                      className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 flex items-center"
                    >
                      <MIcon name="close" className="text-[15px]" />
                    </button>
                  )}
                </div>

                {/* Filtros rápidos: PI, Owner, Classificação e Atuação */}
                <div className="flex flex-wrap items-center gap-3">
                  <div className="flex items-center gap-1">
                    <span className="text-xs font-medium text-slate-500 mr-1">PI:</span>
                    {["Todos", ...PI_OPTIONS].map(pi => (
                      <button
                        key={pi}
                        onClick={() => setSelectedPIFilter(pi)}
                        className={`px-2 py-1 rounded-md text-xs font-semibold transition ${
                          selectedPIFilter === pi
                            ? "bg-indigo-600 text-white"
                            : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50"
                        }`}
                      >
                        {pi}
                      </button>
                    ))}
                  </div>

                  <div className="h-4 w-px bg-slate-200 hidden sm:block"></div>

                  <div className="flex items-center gap-1">
                    <span className="text-xs font-medium text-slate-500 mr-1">Owner:</span>
                    {["Todos", ...OWNERS_ALL].map(owner => (
                      <button
                        key={owner}
                        onClick={() => setSelectedOwner(owner)}
                        className={`px-2 py-1 rounded-md text-xs font-semibold transition ${
                          selectedOwner === owner
                            ? "bg-slate-900 text-white"
                            : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50"
                        }`}
                      >
                        {owner}
                      </button>
                    ))}
                  </div>

                  <div className="h-4 w-px bg-slate-200 hidden sm:block"></div>

                  <div className="flex items-center gap-1">
                    <span className="text-xs font-medium text-slate-500 mr-1">Classificação:</span>
                    {["Todas", ...TYPE_OPTIONS].map(typeOpt => {
                      const isSelected = selectedTypeFilter === typeOpt;
                      const activeStyle =
                        typeOpt === "Todas"
                          ? "bg-slate-900 text-white border-slate-900"
                          : TYPE_ACTIVE_BUTTON[typeOpt] || "bg-indigo-600 text-white";
                      const inactiveStyle =
                        typeOpt === "Todas"
                          ? "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
                          : `${TYPE_BADGE[typeOpt]} opacity-85 hover:opacity-100`;
                      return (
                        <button
                          key={typeOpt}
                          onClick={() => setSelectedTypeFilter(typeOpt)}
                          className={`px-2 py-1 rounded-md text-xs font-semibold border transition ${
                            isSelected ? activeStyle : inactiveStyle
                          }`}
                        >
                          {typeOpt}
                        </button>
                      );
                    })}
                  </div>

                  <div className="h-4 w-px bg-slate-200 hidden sm:block"></div>

                  <div className="flex items-center gap-1">
                    <span className="text-xs font-medium text-slate-500 mr-1">Atuação:</span>
                    {["Todas", "UP", "DOWN", "UP e DOWN"].map(stream => (
                      <button
                        key={stream}
                        onClick={() => setSelectedStream(stream)}
                        className={`px-2 py-1 rounded-md text-xs font-semibold transition ${
                          selectedStream === stream
                            ? "bg-indigo-600 text-white"
                            : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50"
                        }`}
                      >
                        {stream}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 max-w-[1600px] w-full mx-auto px-6 py-5">
            {activeTab === "Dashboard" ? (
              <DashboardView
                items={items}
                onOpenItem={(item, tab = "escopo") => {
                  setSelectedItem(item);
                  setDrawerTab(tab);
                }}
              />
            ) : (
              /* ABA "TODOS": KANBAN COM DRAG & DROP E COLUNA "BACKLOG" ANTES DAS DEMAIS */
              <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar">
                {STATUS_LIST.map(status => {
                  const columnItems = filteredItems.filter(item => item.status === status);
                  const isDragOver = dragOverStatus === status;
                  return (
                    <div
                      key={status}
                      onDragOver={e => handleDragOverColumn(e, status)}
                      onDragLeave={() => setDragOverStatus(null)}
                      onDrop={e => handleDropOnColumn(e, status)}
                      className={`w-80 flex-shrink-0 rounded-xl border flex flex-col max-h-[calc(100vh-205px)] transition-colors ${
                        isDragOver
                          ? "bg-indigo-50/80 border-indigo-400 ring-2 ring-indigo-400/30"
                          : "bg-slate-100/80 border-slate-200/80"
                      }`}
                    >
                      {/* Cabeçalho da Coluna */}
                      <div className="p-3 border-b border-slate-200/70 flex items-center justify-between bg-slate-100 rounded-t-xl">
                        <div className="flex items-center gap-2">
                          <span className={`px-2.5 py-0.5 text-[11px] font-bold rounded-md border ${STATUS_COLORS[status]}`}>
                            {status}
                          </span>
                        </div>
                        <span className="text-xs font-bold text-slate-600 bg-white px-2 py-0.5 rounded-full border border-slate-200">
                          {columnItems.length}
                        </span>
                      </div>

                      {/* Lista de Cards da Coluna */}
                      <div className="p-2.5 space-y-2.5 overflow-y-auto custom-scrollbar flex-1">
                        {columnItems.length === 0 ? (
                          <div className="text-center py-10 text-xs text-slate-400 border border-dashed border-slate-200 rounded-lg">
                            Arraste um card para cá
                          </div>
                        ) : (
                          columnItems.map(item => {
                            const leftBorderColor =
                              item.type === "Discovery"
                                ? "border-l-4 border-l-fuchsia-500"
                                : item.type === "História"
                                ? "border-l-4 border-l-blue-500"
                                : "border-l-4 border-l-emerald-500";
                            return (
                            <div
                              key={item.id}
                              draggable
                              onDragStart={e => handleDragStart(e, item)}
                              onDragEnd={handleDragEnd}
                              onClick={() => {
                                setSelectedItem(item);
                                setDrawerTab("escopo");
                              }}
                              className={`bg-white p-3.5 rounded-xl border ${leftBorderColor} shadow-sm hover:shadow-md hover:border-indigo-300 transition cursor-grab active:cursor-grabbing group ${
                                draggedItemId === item.id ? "opacity-40 border-indigo-400" : "border-slate-200"
                              }`}
                            >
                              {/* Topo do Card: Jira + Tag de PI (ou Backlog quando na coluna Backlog) + Atuação + Owners */}
                              <div className="flex items-center justify-between gap-1.5 mb-2">
                                <div className="flex flex-wrap items-center gap-1">
                                  <span className="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                                    <JiraLink item={item} />
                                  </span>

                                  {/* Seletor de PI permitindo escolher entre Backlog e PI1 até PI4 */}
                                  <select
                                    value={PI_OPTIONS.includes(item.pi) ? item.pi : "Backlog"}
                                    onClick={e => e.stopPropagation()}
                                    onChange={e => {
                                      e.stopPropagation();
                                      updateItemField(item.id, "pi", e.target.value, true);
                                    }}
                                    title="Selecionar entre Backlog e PI1 até PI4"
                                    className={`text-[10px] font-bold px-1.5 py-0.5 rounded border cursor-pointer focus:outline-none ${
                                      PI_COLORS[item.pi] || "bg-slate-100 text-slate-700 border-slate-200"
                                    }`}
                                  >
                                    {PI_OPTIONS.map(piOpt => (
                                      <option key={piOpt} value={piOpt}>{piOpt}</option>
                                    ))}
                                  </select>

                                  <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border ${STREAM_BADGE[item.stream] || "bg-slate-100"}`}>
                                    {item.stream}
                                  </span>

                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          Hipótese / O que iremos medir?
                        </label>
                        <textarea
                          rows={2}
                          placeholder="Ex: Taxa de sucesso na busca de unidades e avanço para Dia/Hora..."
                          value={selectedItem.whatToMeasure || ""}
                          onChange={e => updateItemField(selectedItem.id, "whatToMeasure", e.target.value)}
                          className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-indigo-500"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-700 block mb-1">
                          Qual foi o resultado alcançado?
                        </label>
                        <textarea
                          rows={3}
                          placeholder="Ex: Aumento de +4.2% na conversão da etapa de unidades no VWO..."
                          value={selectedItem.achievedResult || ""}
                          onChange={e => updateItemField(selectedItem.id, "achievedResult", e.target.value)}
                          className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                    </div>
                  )}
                </div>

                {/* Rodapé do Drawer */}
                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3">
                  <button
                    type="button"
                    onClick={() => setItemToDelete(selectedItem)}
                    className="px-3 py-2 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-bold transition flex items-center gap-1.5"
                  >
                    <MIcon name="delete" className="text-[16px]" />
                    <span>Excluir Item</span>
                  </button>

                  <div className="flex items-center gap-3">
                    <span className="text-[11px] text-slate-500 font-medium hidden sm:inline-flex items-center gap-1">
                      <MIcon name={SYNC_ICON[syncState] || "cloud_done"} className="text-[14px] text-indigo-600" />
                      <span>{SYNC_LABEL[syncState]} • Salvo automaticamente</span>
                    </span>
                    <button
                      onClick={() => setSelectedItem(null)}
                      className="bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                    >
                      Fechar Painel
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIRMAÇÃO DE EXCLUSÃO DE ITEM */}
          {itemToDelete && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-start gap-3">
                  <div className="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center text-lg flex-shrink-0">
                    <MIcon name="delete_forever" className="text-[22px]" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-slate-900">Excluir este item?</h3>
                    <p className="text-xs text-slate-500 mt-1">
                      Você está prestes a excluir permanentemente o card{" "}
                      <strong className="text-slate-800">{itemToDelete.jira}</strong>:{" "}
                      <span className="text-slate-700">"{itemToDelete.title}"</span>. Esta ação removerá o item do banco de dados.
                    </p>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setItemToDelete(null)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteItem}
                    className="px-4 py-2 text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white rounded-lg shadow-sm transition"
                  >
                    Sim, Excluir Item
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE NOVA INICIATIVA */}
          {isNewModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
              <form
                onSubmit={handleCreateCard}
                className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl border border-slate-200 space-y-4 max-h-[92vh] overflow-y-auto custom-scrollbar"
              >
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-sm font-bold text-slate-900">Adicionar Nova Iniciativa UX</h3>
                  <button
                    type="button"
                    onClick={() => setIsNewModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 flex items-center justify-center"
                  >
                    <MIcon name="close" className="text-[18px]" />
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div className="col-span-2">
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Link do Card no Jira (opcional)</label>
                    <input
                      type="url"
                      placeholder="https://.../browse/AGDE-1234"
                      value={newCard.jiraUrl}
                      onChange={e => {
                        const url = e.target.value;
                        const code = parseJiraCode(url);
                        setNewCard({ ...newCard, jiraUrl: url, jira: code || newCard.jira });
                      }}
                      className="w-full text-xs border border-slate-200 rounded-lg px-3 py-2"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Código Jira</label>
                    <input
                      type="text"
                      value={newCard.jira}
                      onChange={e => setNewCard({ ...newCard, jira: e.target.value.toUpperCase() })}
                      className="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 font-bold text-indigo-600"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-600 block mb-1">Título da Iniciativa</label>
                  <input
                    type="text"
                    required
                    placeholder="Ex: [Melhoria] Novo fluxo de reagendamento rápido"
                    value={newCard.title}
                    onChange={e => setNewCard({ ...newCard, title: e.target.value })}
                    className="w-full text-xs border border-slate-200 rounded-lg px-3 py-2"
                  />
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Coluna Inicial</label>
                    <select
                      value={newCard.status}
                      onChange={e => {
                        const nextStatus = e.target.value;
                        const nextPi =
                          nextStatus === "Backlog"
                            ? "Backlog"
                            : (newCard.pi === "Backlog" ? "PI3" : newCard.pi);
                        setNewCard({ ...newCard, status: nextStatus, pi: nextPi });
                      }}
                      className="w-full text-xs border border-slate-200 rounded-lg px-2.5 py-2"
                    >
                      {STATUS_LIST.map(s => (
                        <option key={s} value={s}>{s}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">PI</label>
                    <select
                      value={PI_OPTIONS.includes(newCard.pi) ? newCard.pi : "Backlog"}
                      onChange={e => setNewCard({ ...newCard, pi: e.target.value })}
                      className="w-full text-xs border border-slate-200 rounded-lg px-2.5 py-2"
                    >
                      {PI_OPTIONS.map(p => (
                        <option key={p} value={p}>{p}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Classificação</label>
                    <select
                      value={newCard.type}
                      onChange={e => setNewCard({ ...newCard, type: e.target.value })}
                      className="w-full text-xs border border-slate-200 rounded-lg px-2.5 py-2"
                    >
                      {TYPE_OPTIONS.map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Atuação</label>
                    <select
                      value={newCard.stream}
                      onChange={e => setNewCard({ ...newCard, stream: e.target.value })}
                      className="w-full text-xs border border-slate-200 rounded-lg px-2.5 py-2"
                    >
                      {STREAM_OPTIONS.map(st => (
                        <option key={st.value} value={st.value}>{st.label}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-600 block mb-1">Marca</label>
                  <select
                    value={newCard.brand}
                    onChange={e => setNewCard({ ...newCard, brand: e.target.value })}
                    className="w-full text-xs border border-slate-200 rounded-lg px-3 py-2"
                  >
                    {BRAND_OPTIONS.map(b => (
                      <option key={b} value={b}>{b}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-600 block mb-1">Detalhamento / User Story</label>
                  <textarea
                    rows={3}
                    value={newCard.description}
                    onChange={e => setNewCard({ ...newCard, description: e.target.value })}
                    placeholder="Como cliente do Agendamento Digital, eu quero..."
                    className="w-full text-xs border border-slate-200 rounded-lg p-3"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsNewModalOpen(false)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg"
                  >
                    Criar Card
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // APP ROOT (ACESSO DIRETO SEM LOGIN)
    // ==========================================
    function App() {
      return <Board />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
